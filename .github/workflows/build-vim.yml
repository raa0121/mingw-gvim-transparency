name: Build Vim

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64]
        include:
          - arch: x64
            varch: x86_64
            msystem: MINGW64

    steps:
    - name: Initalize
      shell: bash
      run: |
        git config --global core.autocrlf input

    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-${{ matrix.varch }}-toolchain base-devel
        msystem: ${{ matrix.msystem }}
        path-type: inherit

    - name: Update Vim
      id: update
      shell: msys2 {0}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./check-release.sh

    - name: Build
      if: steps.update.outputs.skip == 'no'
      shell: msys2 {0}
      run: |
        makepkg -s --noconfirm
        ls -l

    - name: Upload Artifact
      if: steps.update.outputs.skip == 'no'
      uses: actions/upload-artifact@v4
      with:
        name: gvim-transparency-${{ matrix.varch }}
        path: ./mingw-*.pkg.tar.zst

  release:
    # A PR that bumps PKGBUILD would otherwise be released and pushed to master.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: [build]

    strategy:
      matrix:
        arch: [x64]
        include:
          - arch: x64
            varch: x86_64
            msystem: MINGW64

    steps:
    - name: Initalize
      shell: bash
      run: |
        git config --global core.autocrlf input

    - uses: actions/checkout@v4

    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-${{ matrix.varch }}-toolchain base-devel
        msystem: ${{ matrix.msystem }}
        path-type: inherit

    - name: Setup Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.x

    - name: Update Vim
      id: update
      shell: msys2 {0}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./check-release.sh

    - name: Commit/Push git
      if: steps.update.outputs.skip == 'no'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.update.outputs.version }}
        CHANGED: ${{ steps.update.outputs.changed }}
      shell: msys2 {0}
      run: |
        git config --local user.name "mingw-gvim-transparency CI"
        git config --local user.email "raa0121@users.noreply.github.com"
        git remote set-url origin https://raa0121:${GITHUB_TOKEN}@github.com/raa0121/mingw-gvim-transparency.git
        # PKGBUILD bumped by hand is already committed, so only the tag is missing.
        if [ "$CHANGED" = yes ]; then
          git add PKGBUILD
          git commit -m "v${VERSION}"
          git push origin master
        fi
        # The tag survives a run that failed after pushing it.
        if ! git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" > /dev/null; then
          git tag "${VERSION}"
          git push origin "${VERSION}"
        fi

    - name: Download Artifact (x86_64)
      if: steps.update.outputs.skip == 'no'
      uses: actions/download-artifact@v4
      with:
        name: gvim-transparency-x86_64
        path: pkg

    - name: Create repo.db
      if: steps.update.outputs.skip == 'no'
      shell: msys2 {0}
      run: |
        repo-add ./pkg/mingw-raa0121.db.tar.gz ./pkg/mingw-w64-*gvim-transparency*.tar.*


    - name: Create Release
      if: steps.update.outputs.skip == 'no'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: actions/create-release@master
      with:
        tag_name: ${{ steps.update.outputs.version }}
        release_name: ${{ steps.update.outputs.version }}

    - name: Upload
      if: steps.update.outputs.skip == 'no'
      run: go run github.com/tcnksm/ghr@latest "${{ steps.update.outputs.version }}" pkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
